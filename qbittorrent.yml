services:  
  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:release-v5.2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:  # s6/entrypoint ajusta ownership a PUID/PGID en el arranque
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    hostname: qbit.${HOSTNAME}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    ports:
      - 11040:11040/tcp 
      - 11040:11040/udp
      - 8080:8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_BASE_PATH}/qbittorrent:/config
      - ${DOWNLOADS_PATH}:/downloads
      - ${DATA_PATH}:/data
    networks:
      - media_cli_ntk
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service={{.Name}},component=downloader,environment=mediacli"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

networks:
  media_cli_ntk:
    external: true
