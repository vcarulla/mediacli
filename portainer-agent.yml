services:
  portainer_agent:
    container_name: portainer_agent
    image: portainer/agent:2.42.0
    security_opt:
      - no-new-privileges:true
    # EXCEPCION al §3 del playbook (documentada): el agente de Portainer
    # necesita el socket y estos mounts del host por diseño, no soporta
    # socket-proxy. Contencion: nnp + limits + pin de version.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    ports:
      - 9001:9001
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
