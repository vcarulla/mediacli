services:
  recyclarr:
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:7.5.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:  # s6/entrypoint ajusta ownership a PUID/PGID en el arranque
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    hostname: recyclarr.${HOSTNAME}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_BASE_PATH}/recyclarr:/config
    networks:
      - media_cli_ntk
    healthcheck:
      # el daemon real es supercronic; recyclarr solo corre al disparar el cron
      test: ["CMD-SHELL", "pgrep supercronic || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service={{.Name}},component=sync,environment=mediacli"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped

networks:
  media_cli_ntk:
    external: true
