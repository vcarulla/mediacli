services:
  emby:
    container_name: embyserver
    image: emby/embyserver:4.9.4.1
    hostname: emby.${HOSTNAME}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    ports:
      - 8096:8096
      - 8920:8920
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_BASE_PATH}/emby:/config
      - ${DATA_PATH}:/data
    networks:
      - media_cli_ntk
    healthcheck:
      test: ["CMD-SHELL", "pgrep EmbyServer || exit 0"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service={{.Name}},component=media-server,environment=mediacli"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

networks:
  media_cli_ntk:
    external: true
