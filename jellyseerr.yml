services:
  jellyseerr:
    container_name: jellyseerr
    image: fallenbagel/jellyseerr:2.7.3
    hostname: jellyseerr.${HOSTNAME}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_BASE_PATH}/jellyseerr:/app/config
    networks:
      - media_cli_ntk
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=jellyseerr,component=requests,environment=mediacli"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

networks:
  media_cli_ntk:
    external: true
