services: 
  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:1.5.5
    hostname: bazarr.${HOSTNAME}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    ports:
      - 6767:6767
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_BASE_PATH}/bazarr:/config
      - ${DATA_PATH}:/data
    networks:
      - media_cli_ntk
    healthcheck:
      test: ["CMD-SHELL", "pgrep bazarr || exit 0"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service={{.Name}},component=subtitles,environment=mediacli"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

networks:
  media_cli_ntk:
    external: true
